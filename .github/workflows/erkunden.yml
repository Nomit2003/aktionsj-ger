name: Quellen prüfen
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/erkunden.yml", "scripts/erkunden.py"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.49.1 && python -m playwright install --with-deps chromium
      - run: python scripts/erkunden.py
