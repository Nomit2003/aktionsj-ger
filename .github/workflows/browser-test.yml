name: Browser-Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/browser_probe.py", ".github/workflows/browser-test.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.49.1 && python -m playwright install --with-deps chromium
      - run: python scripts/browser_probe.py
