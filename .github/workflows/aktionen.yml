name: Aktionen laden
on:
  schedule:
    - cron: "17 4 * * *"   # jeden Tag ca. 05:17 / 06:17 Uhr Schweizer Zeit; neue Aktionen werden so am Erscheinungstag übernommen
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/aktionen.yml"]
permissions:
  contents: write
concurrency: { group: aktionen, cancel-in-progress: false }
jobs:
  laden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/aktionen.py
      - name: Änderungen speichern
        run: |
          git config user.name "aktionen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aktionen.json
          git diff --cached --quiet || (git commit -m "Aktionen aktualisiert" && git push)
