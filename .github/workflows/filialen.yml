name: Filialen laden
on:
  schedule:
    - cron: "40 3 * * 1"   # jeden Montag früh
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/filialen.py", ".github/workflows/filialen.yml"]
permissions:
  contents: write
concurrency: { group: daten-commit, cancel-in-progress: false }
jobs:
  laden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/filialen.py
      - name: Änderungen speichern
        run: |
          git config user.name "aktionen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filialen.json
          git diff --cached --quiet || (git commit -m "Filialen aktualisiert" && git pull --rebase && git push)
